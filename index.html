<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindNote Engine</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>

  <section id="view-home" class="view-screen">
    <header class="home-header">
      <h1>Meus Mapas</h1>
    </header>

    <div id="home-estado-vazio" class="home-estado-vazio">
      <p>Você ainda não tem mapas salvos.</p>
      <p>Toque no botão “+” para criar o primeiro.</p>
    </div>

    <div id="home-grade-cartoes" class="home-grade-cartoes"></div>

    <div class="home-botao-flutuante-container">
      <div id="home-menu-novo" class="home-menu-novo">
        <button id="home-opcao-criar-zero" type="button" class="home-menu-novo-item">Criar do Zero</button>
        <button id="home-opcao-importar" type="button" class="home-menu-novo-item">Importar JSON</button>
      </div>
      <button id="home-botao-novo" type="button" class="home-botao-flutuante" aria-label="Novo mapa">+</button>
    </div>
  </section>

  <section id="view-editor" class="view-screen" style="display: none;">
    <!-- Mantém o contrato histórico do editor sem ocupar espaço de layout. -->
    <div id="painel-lateral" hidden></div>

    <!-- Top Bar Flutuante Global -->
    <header id="mn-topbar" class="mn-topbar mn-glass" data-mindnote-ui>
      <button id="botao-voltar-home" class="mn-topbar-btn" type="button" title="Voltar aos Mapas">← Meus Mapas</button>
      <div class="mn-topbar-divider"></div>
      <button id="btn-abrir-backstage" class="mn-topbar-btn" type="button" title="Abrir Bastidores e JSON">⚙️ Bastidores</button>
      <button id="btn-processar-topo" class="mn-topbar-btn" type="button" title="Reprocessar Árvores">⚡ Processar</button>
      <div class="mn-topbar-divider"></div>
      <button id="btn-undo" class="mn-topbar-btn mn-topbar-btn--icon" type="button" title="Desfazer (Ctrl+Z)" disabled aria-disabled="true" aria-label="Desfazer">↶</button>
      <button id="btn-redo" class="mn-topbar-btn mn-topbar-btn--icon" type="button" title="Refazer (Ctrl+Y)" disabled aria-disabled="true" aria-label="Refazer">↷</button>
      <div class="mn-topbar-divider"></div>
      <button id="botao-tema" class="mn-topbar-btn" type="button">Tema: Claro</button>
      <button id="botao-nova-raiz" class="mn-topbar-btn" type="button">+ Nova Raiz</button>
      <div class="mn-topbar-divider"></div>
      <button id="botao-exportar-pdf" class="mn-topbar-btn mn-topbar-btn--primary" type="button">Exportar PDF</button>
      <span id="indicador-autosave" class="mn-topbar-status">Salvo</span>
      <span id="cabecalho-painel" hidden></span>
    </header>

    <!-- Canvas fullscreen, fora do fluxo dos painéis flutuantes -->
    <main id="canvas-container" aria-label="Mapa mental SVG"></main>

    <!-- Camada de UI Flutuante (Overlays) -->
    <div id="mindnote-ui-layer" data-mindnote-ui>
      <div id="node-inspector-envelope" class="mn-inspector-envelope" aria-hidden="true" data-open="false">
        <aside id="node-inspector" class="mn-inspector mn-glass mn-glass--strong" aria-label="Inspetor do nó" aria-hidden="true"></aside>
      </div>

      <div id="json-backstage-envelope" class="mn-backstage-envelope" aria-hidden="true" data-open="false">
        <aside id="json-backstage" class="mn-backstage mn-glass mn-glass--strong" aria-label="Bastidores do documento" aria-hidden="true">
          <header class="mn-panel-header">
            <div>
              <span class="mn-panel-eyebrow">CONFIGURAÇÃO AVANÇADA</span>
              <h2 class="mn-panel-title">Bastidores</h2>
            </div>
            <button id="btn-fechar-backstage" class="mn-icon-button" type="button" aria-label="Fechar bastidores">✕</button>
          </header>
          <nav class="mn-backstage-tabs" aria-label="Abas dos bastidores">
            <button class="mn-segment-button is-active" type="button" data-tab="json" aria-selected="true">JSON Bruto</button>
            <button class="mn-segment-button" type="button" data-tab="meta" aria-selected="false">Metadados</button>
          </nav>
          <div class="mn-panel-scroll">
            <div id="tab-content-json" class="mn-tab-content">
              <div class="mn-field">
                <label class="mn-field-label" for="entrada-json">
                  <span>Estrutura do Mapa (JSON)</span>
                  <span class="mn-field-hint">Auto-salvamento ativo</span>
                </label>
                <textarea id="entrada-json" class="mn-json-editor" rows="14" spellcheck="false" placeholder="Cole o JSON aqui..."></textarea>
              </div>
              <div class="mn-field" style="margin-top: 12px;">
                <label class="mn-field-label" for="entrada-escala"><span>Escala de entrelinha (px)</span></label>
                <input type="number" id="entrada-escala" class="mn-text-input" value="26" min="10" max="120" step="1">
              </div>
              <button id="botao-processar" class="mn-button mn-button--primary" type="button" style="margin-top: 12px;">Processar Árvore</button>
              <pre id="area-erro" class="erro"></pre>
            </div>
            <div id="tab-content-meta" class="mn-tab-content" hidden>
              <div class="mn-property-group">
                <div class="mn-property-content" style="padding-top: 12px;">
                  <div class="mn-meta-row"><span>Total de Nós</span><span id="meta-total-nos" class="mn-meta-value">0</span></div>
                  <div class="mn-meta-row"><span>Profundidade Máxima</span><span id="meta-profundidade" class="mn-meta-value">0</span></div>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Fase 2 (v2.0): camada de persistência local — não depende de nenhum outro script -->
  <script src="js/db.js"></script>
  <!-- Biblioteca jsPDF local (vendor) — deve vir antes dos scripts da engine -->
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/engine.text.js"></script>
  <script src="js/engine.geometry.js"></script>
  <script src="js/render.svg.js"></script>
  <script src="js/render.pdf.js"></script>
  <!-- Fase 1 (v2.0): sanitizador anti-conversa + diagnóstico visual de erro — devem vir antes de app.js -->
  <script src="js/parser.sanitizer.js"></script>
  <script src="js/parser.diagnostics.js"></script>
  <!-- Fase 2 (v2.0): roteador SPA e Home Dashboard — devem vir antes de app.js -->
  <script src="js/app.router.js"></script>
  <script src="js/home.dashboard.js"></script>
  <!-- Fase 3 (v2.0): estabilização de câmera e Zoom Dock — devem vir antes de app.js -->
  <script src="js/canvas.camera.js"></script>
  <script src="js/canvas.zoomdock.js"></script>
  <script src="js/ui.performance.js"></script>
  <script src="js/inspector.panel.js"></script>
  <script src="js/backstage.panel.js"></script>
  <script src="js/history.undoredo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
