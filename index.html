<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindNote Engine</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="painel-lateral">
  <h1>MindNote Engine</h1>
  <label for="entrada-json">Cole o JSON gerado pelo NotebookLM:</label>
  <textarea id="entrada-json" rows="14" placeholder='{"titulo": "Titulo Raiz", "filhos": []}'></textarea>
  <button id="botao-processar" type="button">Processar Arvore</button>
  <pre id="area-erro" class="erro"></pre>
</div>

<div id="area-visualizacao">
  <h2>Debug Textual da Arvore (Fase 1)</h2>
  <pre id="area-debug"></pre>

  <h2>Canvas Vetorial (habilitado na Fase 4)</h2>
  <svg id="svg-mapa" width="100%" height="600"></svg>
</div>

<script src="js/engine.text.js"></script>
<script src="js/engine.geometry.js"></script>
<script src="js/render.svg.js"></script>
<script src="js/render.pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
