name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js e Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Inicializar Projeto Movel
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MindNote" "com.eduardo.mindnote" --web-dir .
          npx cap add android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Compilar APK Debug
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Armazenar Binario Gerado
        uses: actions/upload-artifact@v4
        with:
          name: MindNote-Instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
